# Runs the node:test suite with its coverage gate (100% lines and functions).
# No Redis is needed: the tests run every strategy against the in-memory db client.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node:test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
